# enable passthrough for terminal apps to display image
set -gq allow-passthrough on

# disable visual activity notifications in the status bar
set -g visual-activity off

# basics
set -g history-limit 10002
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -s escape-time 0

# terminal
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",xterm*:Tc"

# status bar
set-option -g status-left-length 70
# status-left with conditional: shows hostname if @show_host is set, otherwise session name
set-option -g @show_host 0
set-option -g @popup-width "80%"
set-option -g @popup-height "80%"
set-option -g @popup-border "fg=#232728"
set-option -g status-left "#[fg=#BD6F3E]#{?@show_host,#(cd #{pane_current_path}; git symbolic-ref --short -q HEAD || git rev-parse --short HEAD 2>/dev/null),#{session_name}} #[default]"
set-option -g status-right " "
set -g status-style bg=default,fg=#9E8069
set -g window-status-current-style bg=default,fg=#7DAEA3
set -g window-status-style bg=default,fg=#9E8069
set -g message-style bg=default,fg=#9E8069
set -g window-status-format "#[fg=#9E8069]#{window_index}:#{window_name}#{window_flags} #[default]"
set -g window-status-current-format "#[fg=#7DAEA3]#{window_index}:#{window_name}#{window_flags} #[default]"
set-option -g window-status-current-style "fg=#e1a345"
set-option -g window-status-last-style "fg=#936a2e"

# borders
set -g pane-border-style fg=#1c1c1c,bg=default
set -g pane-active-border-style fg=#1c1c1c,bg=default

set -g prefix C-a
bind C-a send-prefix
bind r source-file @out@\; display-message 'tmux.conf reloaded'
bind C-p previous-window
bind C-n next-window
bind z resize-pane -Z

# pane navigation with Ctrl+a arrows
# by default already working, o for cycling

# session switching with Ctrl+a arrows
bind -r Left switch-client -p
bind -r Right switch-client -n

# session/window chooser without preview
bind s choose-tree -sN
bind w choose-tree -wN
set -g mode-style "bg=default,fg=#9E8069"

# size presets
bind-key -n '¡' resizep -y "25%"
bind-key -n '€' resizep -y "50%"
bind-key -n '£' resizep -y "75%"
bind-key -n '¢' resizep -y "100%"
bind-key B break-pane -d

# splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind f run-shell 'S="#{session_name}"; tmux has-session -t "${S}_floating" 2>/dev/null || tmux new-session -d -s "${S}_floating" -c "#{pane_current_path}"; tmux set -t "${S}_floating" @floating 1; tmux set -t "${S}_floating" @floating-parent "$S"; tmux popup -E -w "#{@popup-width}" -h "#{@popup-height}" -S "#{@popup-border}" "tmux attach -t ${S}_floating"'
bind F run-shell 'S="#{session_name}"; N=$(tmux list-sessions -F "##{session_name}" | grep -c "^${S}_floating"); tmux new-session -d -s "${S}_floating_${N}" -c "#{pane_current_path}"; tmux set -t "${S}_floating_${N}" @floating 1; tmux set -t "${S}_floating_${N}" @floating-parent "$S"; tmux popup -E -w "#{@popup-width}" -h "#{@popup-height}" -S "#{@popup-border}" "tmux attach -t ${S}_floating_${N}"'

# status toggle
set-option -g status off
bind-key -T prefix t set-option -g status
bind-key C-k run-shell "tmux set-option -g status-position top;"
bind-key C-j run-shell "tmux set-option -g status-position bottom;"

# plugins (provided by Nix, see flake.nix)
run-shell @sensible@
run-shell @tmux_fzf@

# shell
set -g default-shell @zsh@
set -g default-command "exec @zsh@"


# hostname toggle (Control+a g)
bind g if -F '#{@show_host}' 'set -g @show_host 0' 'set -g @show_host 1'
set -g mouse on
